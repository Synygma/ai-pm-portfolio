<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="600" viewBox="0 0 1600 600" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="a334155" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="a1D4ED8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1D4ED8"/></marker><marker id="a6D28D9" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6D28D9"/></marker><marker id="a15803D" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803D"/></marker><marker id="aBE123C" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#BE123C"/></marker><marker id="a0369A1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0369A1"/></marker><marker id="aB45309" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B45309"/></marker><marker id="a0F766E" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F766E"/></marker><marker id="aC2410C" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C2410C"/></marker><marker id="aA16207" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A16207"/></marker></defs><rect x="0" y="0" width="1600" height="600" rx="0" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0"/><text xml:space="preserve" x="800" y="52" font-size="32" font-weight="800" fill="#0F172A" text-anchor="middle">How the LinkedIn automation works</text><text xml:space="preserve" x="800" y="86" font-size="17" font-weight="400" fill="#475569" text-anchor="middle">From an idea to a published, fact-checked post: you set the direction and approve; the system does the rest</text><rect x="40" y="140" width="272" height="300" rx="18" fill="#EEF2F7" stroke="#475569" stroke-width="2.5"/><circle cx="176.0" cy="140" r="30" fill="#475569"/><text xml:space="preserve" x="176.0" y="150" font-size="28" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text><text xml:space="preserve" x="176.0" y="222" font-size="30" font-weight="800" fill="#475569" text-anchor="middle">Choose</text><text xml:space="preserve" x="176.0" y="254" font-size="18" font-weight="600" fill="#0F172A" text-anchor="middle">Topic</text><text xml:space="preserve" x="176.0" y="310" font-size="16.5" font-weight="400" fill="#0F172A" text-anchor="middle">You give a topic, or the</text><text xml:space="preserve" x="176.0" y="338" font-size="16.5" font-weight="400" fill="#0F172A" text-anchor="middle">system picks one of your</text><text xml:space="preserve" x="176.0" y="366" font-size="16.5" font-weight="400" fill="#0F172A" text-anchor="middle">focus areas and opinions</text><polyline points="316,290 344,290" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#a334155)"/><rect x="348" y="140" width="272" height="300" rx="18" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2.5"/><circle cx="484.0" cy="140" r="30" fill="#6D28D9"/><text xml:space="preserve" x="484.0" y="150" font-size="28" font-weight="800" fill="#FFFFFF" text-anchor="middle">2</text><text xml:space="preserve" x="484.0" y="222" font-size="30" font-weight="800" fill="#6D28D9" text-anchor="middle">Find</text><text xml:space="preserve" x="484.0" y="254" font-size="18" font-weight="600" fill="#0F172A" text-anchor="middle">What&#x27;s trending</text><text xml:space="preserve" x="484.0" y="310" font-size="16.5" font-weight="400" fill="#0F172A" text-anchor="middle">Scans the last 3 days of</text><text xml:space="preserve" x="484.0" y="338" font-size="16.5" font-weight="400" fill="#0F172A" text-anchor="middle">industry news and ranks</text><text xml:space="preserve" x="484.0" y="366" font-size="16.5" font-weight="400" fill="#0F172A" text-anchor="middle">the best story for LinkedIn</text><polyline points="624,290 652,290" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#a334155)"/><rect x="656" y="140" width="272" height="300" rx="18" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2.5"/><circle cx="792.0" cy="140" r="30" fill="#1D4ED8"/><text xml:space="preserve" x="792.0" y="150" font-size="28" font-weight="800" fill="#FFFFFF" text-anchor="middle">3</text><text xml:space="preserve" x="792.0" y="222" font-size="30" font-weight="800" fill="#1D4ED8" text-anchor="middle">Write</text><text xml:space="preserve" x="792.0" y="254" font-size="18" font-weight="600" fill="#0F172A" text-anchor="middle">The post</text><text xml:space="preserve" x="792.0" y="310" font-size="16.5" font-weight="400" fill="#0F172A" text-anchor="middle">Builds the post from</text><text xml:space="preserve" x="792.0" y="338" font-size="16.5" font-weight="400" fill="#0F172A" text-anchor="middle">verified facts, in your</text><text xml:space="preserve" x="792.0" y="366" font-size="16.5" font-weight="400" fill="#0F172A" text-anchor="middle">voice and opinions</text><polyline points="932,290 960,290" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#a334155)"/><rect x="964" y="140" width="272" height="300" rx="18" fill="#DCFCE7" stroke="#15803D" stroke-width="2.5"/><circle cx="1100.0" cy="140" r="30" fill="#15803D"/><text xml:space="preserve" x="1100.0" y="150" font-size="28" font-weight="800" fill="#FFFFFF" text-anchor="middle">4</text><text xml:space="preserve" x="1100.0" y="222" font-size="30" font-weight="800" fill="#15803D" text-anchor="middle">Check</text><text xml:space="preserve" x="1100.0" y="254" font-size="18" font-weight="600" fill="#0F172A" text-anchor="middle">3 expert reviewers</text><text xml:space="preserve" x="1100.0" y="310" font-size="16.5" font-weight="400" fill="#0F172A" text-anchor="middle">Facts · Legal &amp; sensitivity</text><text xml:space="preserve" x="1100.0" y="338" font-size="16.5" font-weight="400" fill="#0F172A" text-anchor="middle">· Engagement. Nothing</text><text xml:space="preserve" x="1100.0" y="366" font-size="16.5" font-weight="400" fill="#0F172A" text-anchor="middle">unverified gets through</text><polyline points="1240,290 1268,290" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#a334155)"/><rect x="1272" y="140" width="272" height="300" rx="18" fill="#FFEDD5" stroke="#C2410C" stroke-width="2.5"/><circle cx="1408.0" cy="140" r="30" fill="#C2410C"/><text xml:space="preserve" x="1408.0" y="150" font-size="28" font-weight="800" fill="#FFFFFF" text-anchor="middle">5</text><text xml:space="preserve" x="1408.0" y="222" font-size="30" font-weight="800" fill="#C2410C" text-anchor="middle">Publish</text><text xml:space="preserve" x="1408.0" y="254" font-size="18" font-weight="600" fill="#0F172A" text-anchor="middle">With your OK</text><text xml:space="preserve" x="1408.0" y="310" font-size="16.5" font-weight="400" fill="#0F172A" text-anchor="middle">You see the final post;</text><text xml:space="preserve" x="1408.0" y="338" font-size="16.5" font-weight="400" fill="#0F172A" text-anchor="middle">it goes live on LinkedIn</text><text xml:space="preserve" x="1408.0" y="366" font-size="16.5" font-weight="400" fill="#0F172A" text-anchor="middle">only when you say “Post”</text><rect x="40" y="470" width="1520" height="54" rx="12" fill="#FEF9C3" stroke="#A16207" stroke-width="2"/><text xml:space="preserve" x="800" y="504" font-size="17" font-weight="600" fill="#A16207" text-anchor="middle">You stay in control: you choose or approve the topic area, and every post needs your “Post now” before it goes live.</text><text xml:space="preserve" x="800" y="566" font-size="15" font-weight="400" fill="#475569" text-anchor="middle">Every step (sources, reviews, drafts, final post, LinkedIn link) is saved in the project folder for audit.</text></svg>