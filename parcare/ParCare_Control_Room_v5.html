 o.series.forEach((s,k)=>{const c=s.color||col(k),pts=s.data.map((v,i)=>[X(i),Y(v)]),d=pts.map((q,i)=>(i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)).join('');

  html:()=>`<div class="sec">Conversion and revenue</div>`+tiles(['F3','P5','P3','P4','P7','F4'])+panel('Plans at a glance','Free, monthly, 6-month, annual and employer-sponsored: price, families, revenue and assumed churn.',['F2','F4','P6'],planTable())+`<div class="g2">`+panel('Upgrade funnel','From trial start to payment.',['F3','P3','P4'],chart('upfunnel'))+panel('Plan mix and revenue by plan','Families and net revenue by billing plan.',['F1','F2','P6'],chart('mix'))+`</div>`+`<div class="sec">Annual plan and the 6-month decoy</div>`+tiles(['P6','P11','P12','P10','P13','P14'])+`<div class="g2">`+panel('Decoy test: three options vs two','Directional read; decision at gate 3.',['P11','P6'],chart('decoy'))+panel('Price test, beta (Mar–May 2027)','₹299, ₹399 and ₹499 a month.',['F3','P7'],chart('pricetest'))+`</div>`+`<div class="sec">Retention and guardrails</div>`+tiles(['P8','P9','P15','P16','P17','P18'])+panel('Channel mix','Share of activated families by channel.',['L14','P18'],chart('channels'))},
 {id:'d9',code:'D9',name:'Employer & Partner Sales',cad:'Monthly',full:'Employer & Partner Sales',aud:'Sales and partnerships, Finance, Founders',refresh:'Weekly pipeline call; monthly review with Finance',tool:'CRM sheet + Metabase',ms:[...BS],
  html:()=>tiles(BS)+`<div class="g2">`+panel('Employer pipeline','From first HR conversation to paying employer.',['S1','S2','S4'],chart('pipeline'))+panel('Employer price talks','₹99, ₹149 and ₹199 per family a month.',['S5'],chart('empprice'))+`</div>`+panel('Employer accounts','Anonymised. Enrolment counts only, in groups of 20 or more.',['S2','S3','S6'],chart('accounts'))+panel('What an employer sees','The promise that sits behind the product.',[],`<div class="tbl-w"><table class="tbl"><tbody><tr><td><b>Employers see</b></td><td>Enrolment counts, in groups of 20 or more; the invoice</td></tr><tr><td><b>Employers never see</b></td><td>Any family's check-ins, digests, voice clips, consent choices or engagement</td></tr><tr><td><b>Price</b></td><td>₹149 per enrolled family a month plus GST; minimum 50 families; the 6-month decoy is never shown in employer contracts</td></tr></tbody></table></div>`)}
];
const NSBOARD={id:'map',code:'Map',name:'Who sees what',cad:'All boards',ms:[]};

/* ---------- map board ---------- */
function mapBoard(){
 const head=`<tr><th>Board</th><th>Cadence</th>${RK.map(r=>`<th title="${ROLE[r]}">${r}</th>`).join('')}</tr>`;
 const rows=BOARDS.map(b=>`<tr><td><b>${b.code}</b> ${b.full}</td><td class="c">${b.cad}</td>${RK.map(r=>{const own=b.ms.some(i=>i!=='NS'&&M[i].owner===r),see=b.ms.some(i=>i!=='NS'&&M[i].also.includes(r));const k=own?'o':see?'s':'x';return `<td><button class="${k}" data-go="${b.id}" data-r="${r}" title="${ROLE[r]} · ${b.full}">${own?'●':see?'○':'·'}</button></td>`}).join('')}</tr>`).join('');
 const key=RK.map(r=>`<span class="chip"><b>${r}</b> ${ROLE[r]}</span>`).join('');
 return panel('Who sees what, and how often','Each row is a dashboard, each column a role. Filled means the role owns at least one metric on it; outlined means it sees it. Select a cell to open that board in that role.',[],`<div class="tbl-w mx"><table class="tbl">${head}${rows}</table></div><div class="row" style="margin-top:6px">${key}</div><p class="note">In production each board is restricted to its audience. They are all open here so reviewers can see every cut.</p>`)+
 panel('Board details','',[],`<div class="tbl-w"><table class="tbl"><thead><tr><th>Board</th><th>Refresh and review</th><th>Audience</th><th>Suggested tool</th></tr></thead><tbody>${BOARDS.map(b=>`<tr><td><b>${b.code}</b> ${b.full}</td><td>${b.refresh}</td><td>${b.aud}</td><td>${b.tool}</td></tr>`).join('')}</tbody></table></div>`)}

/* ---------- shell ---------- */
function owned(){const own=Object.values(M).filter(m=>m.id!=='NS'&&m.owner===S.role),see=Object.values(M).filter(m=>m.id!=='NS'&&m.also.includes(S.role)),bs=BOARDS.filter(b=>b.ms.some(i=>i!=='NS'&&M[i].owner===S.role)).length;return [own.length,see.length,bs]}
function shell(){
 const sc=S.sc,st=stat('NS',sc),b=BOARDS.find(x=>x.id===S.board)||null;
 const roleNote=S.role==='all'?'Reviewer view: every board and metric is shown. Pick a role to see what that person owns.':(([o,s,bs])=>`Viewing as ${ROLE[S.role]}: owns ${o} metrics across ${bs} boards and sees ${s} more. Outlined means owned, normal means seen, faded means not for this role.`)(owned());
 const strip=`<div class="ns" data-id="NS" tabindex="0"><div><div class="eyebrow">North Star</div><h2>Weekly Connected Households</h2><div class="big">${IN(M.NS.v[sc])} <span class="pill ${st}">${STL[st]}</span></div></div><div>${spark(ser('NS',30,'ns'),st,'',1500)}<div class="note">Last 30 days, plan target 1,500</div></div><div class="def"><b>Definition.</b> Households in the week where the parent answered at least 50% of the check-ins she consented to and the child opened at least 75% of the daily digests sent that week (6 of 7 in a full week). Free and Plus both count. Target 1,500 by 30 Nov 2027, recalibrated at gate 1 from the pilot.<br><b>This quarter reads:</b> ${QREAD[sc]}.</div></div>`;
 const tabs=BOARDS.map(x=>`<button class="tab" role="tab" aria-selected="${S.board===x.id}" data-b="${x.id}"><small>${x.cad}</small><span>${x.code} ${x.name}${S.role!=='all'&&x.ms.some(i=>i!=='NS'&&M[i].owner===S.role)?'<i class="dot" title="You own metrics here"></i>':''}</span></button>`).join('')+`<button class="tab" role="tab" aria-selected="${S.board==='map'}" data-b="map"><small>All boards</small><span>Who sees what</span></button>`;
 return `<div class="top"><div><h1>ParCare Control Room</h1><p>Metrics and dashboards for ParCare, scaled to the Year-1 marketing plan (v3) · PDM Group 6</p></div><div class="badges"><span class="chip hl">Simulated data</span><span class="chip">Plan v3 · Nov 2027 scale</span><span class="chip">Plus ₹399 · annual ₹3,999</span><span class="chip">Draft for team review</span></div></div>
 <div class="ctl"><div class="row"><span class="lbl">Cadence</span><div class="tabs" role="tablist">${tabs}</div></div>
 <div class="row"><span class="lbl">Viewing as</span><div class="roles">${['all',...RK].map(r=>`<button class="rb" data-r="${r}" aria-pressed="${S.role===r}">${ROLE[r]}</button>`).join('')}</div></div>
 <div class="row"><span class="lbl">Scenario</span><div class="seg">${SCN.map((n,i)=>`<button data-sc="${i}" aria-pressed="${S.sc===i}">${n} case</button>`).join('')}</div><label class="chk"><input type="checkbox" id="rs" ${S.restrict?'checked':''} ${S.role==='all'?'disabled':''}> Preview restricted access (hide what this role cannot see)</label></div>
 <p class="rolenote">${roleNote}</p></div>
 <div class="banner">Every number here is simulated for illustration. Boards show aggregates only: no transcripts, voice notes or names. Prices, targets and thresholds follow the revised marketing plan (v3); they are hypotheses to recalibrate after the 30-day pilot. A dashed line or tick on a graph marks the expected value: the target where one is set, otherwise the best-case value.</div>
 ${sc===2?`<div class="banner bad">Incident mode. The audit found 1 missed emergency word (C4). A zero-tolerance control was breached, so the company is in incident mode whatever the quarter scenario says. Founders are told the same day.</div>`:''}
 ${strip}
 ${b?`<div><h2>${b.code} · ${b.full}</h2><p class="note">${b.aud} · ${b.refresh} · Suggested tool: ${b.tool}</p></div>`:`<div><h2>Who sees what, and how often</h2></div>`}
 <div id="board" style="display:flex;flex-direction:column;gap:12px">${b?b.html():mapBoard()}</div>`}

/* ---------- tile tooltips (hover, keyboard focus, tap) ---------- */
const tipEl=document.createElement('div');tipEl.id='tip';tipEl.setAttribute('role','tooltip');tipEl.hidden=true;document.body.appendChild(tipEl);
const trow=(k,v)=>`<div class="tr"><span>${k}</span>${v}</div>`;
function tipFor(t){const id=t.dataset.id;
 if(id&&INFO[id]){const m=M[id],e=EX[id];return `<b>${m.disp||m.id} · ${m.name}</b>`+trow('What it measures',INFO[id][0])+trow('Formula',INFO[id][1])+(e&&!m.text?trow('Dashed line on the graph',e[1]+(/^Best/.test(e[1])?' (best-case value; no target is set yet)':' (target)')):'')}
 return `<b>${t.dataset.name}</b>`+trow('What it measures',t.dataset.what)+trow('Formula',t.dataset.calc)+trow('Dashed line on the graph',t.dataset.ex+' (target)')}
function showTip(t){tipEl.innerHTML=tipFor(t);tipEl.hidden=false;const r=t.getBoundingClientRect(),w=tipEl.offsetWidth,h=tipEl.offsetHeight;
 let x=Math.min(Math.max(8,r.left+r.width/2-w/2),innerWidth-w-8),y=r.bottom+8;if(y+h>innerHeight-8)y=r.top-h-8;if(y<8)y=8;tipEl.style.left=x+'px';tipEl.style.top=y+'px'}
function hideTip(){tipEl.hidden=true}
let touchAt=0;
document.addEventListener('mouseover',e=>{if(Date.now()-touchAt<700)return;const t=e.target.closest('.tile,.ns');t?showTip(t):hideTip()});
document.addEventListener('focusin',e=>{const t=e.target.closest&&e.target.closest('.tile,.ns');t?showTip(t):hideTip()});
document.addEventListener('focusout',hideTip);
document.addEventListener('keydown',e=>{if(e.key==='Escape')hideTip()});
document.addEventListener('click',e=>{const t=e.target.closest('.tile,.ns');if(t&&(e.pointerType==='touch'||matchMedia('(hover:none)').matches)){touchAt=Date.now();showTip(t)}else if(!t)hideTip()});
window.addEventListener('scroll',hideTip,{passive:true});

let T0=Date.now();
function render(){
 document.body.classList.toggle('restrict',S.restrict&&S.role!=='all');
 const keepScroll=window.scrollY;
 hideTip();$('#app').innerHTML=shell();T0=Date.now();
 $$('.chart').forEach(el=>{const f=CH[el.dataset.c];if(f)f(el,Math.max(260,Math.floor(el.clientWidth)||320))});
 window.scrollTo(0,keepScroll);
 try{history.replaceState(null,'','#'+S.board)}catch(e){}}
document.addEventListener('click',e=>{
 const t=e.target.closest('button');if(!t)return;
 if(t.dataset.go){S.board=t.dataset.go;S.role=t.dataset.r;render();window.scrollTo(0,0);return}
 if(t.dataset.b){S.board=t.dataset.b;render();return}
 if(t.dataset.r){S.role=t.dataset.r;if(S.role==='all')S.restrict=false;render();return}
 if(t.dataset.sc){S.sc=+t.dataset.sc;render()}});
document.addEventListener('change',e=>{if(e.target.id==='rs'){S.restrict=e.target.checked;render()}});
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if((BOARDS.some(b=>b.id===h)||h==='map')&&h!==S.board){S.board=h;render()}});
let lw=innerWidth;window.addEventListener('resize',()=>{if(Math.abs(innerWidth-lw)>20){lw=innerWidth;clearTimeout(window._rz);window._rz=setTimeout(render,150)}});
setInterval(()=>{$$('.tm').forEach(el=>{const s=+el.dataset.s+(Date.now()-T0)/1000;el.textContent=mmss(s);el.className='tm'+(s>1800?' r':s>600?' w':'')})},1000);
{const h=location.hash.slice(1);if(BOARDS.some(b=>b.id===h)||h==='map')S.board=h}
render();
</script>
